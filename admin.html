<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli - AniVerse</title>
  
  <script>
    // Route Guard: Redirect if not admin
    if (localStorage.getItem('userRole') !== 'admin') {
      window.location.href = 'index.html';
    }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    .admin-container {
      padding: 120px 20px 60px;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }
    .admin-title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: white;
      text-shadow: 0 0 10px rgba(255, 51, 68, 0.3);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    .stat-card {
      background: rgba(20, 20, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-gradient);
    }
    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      color: white;
      font-size: 2.2rem;
      font-family: var(--font-display);
      font-weight: 700;
    }
    
    .table-container {
      background: rgba(20, 20, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow-x: auto;
    }
    .table-header {
      font-size: 1.5rem;
      font-family: var(--font-display);
      color: white;
      margin-bottom: 20px;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .admin-table th {
      color: var(--text-secondary);
      font-weight: 600;
      padding: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .admin-table td {
      padding: 15px;
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }
    .admin-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-active .status-dot { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-offline .status-dot { background: #6b7280; }
    
    .sub-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .sub-premium { background: rgba(255, 51, 68, 0.15); color: #ff3344; border: 1px solid rgba(255,51,68,0.3); }
    .sub-free { background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); }
  </style>
</head>
<body class="admin-page">

  <main class="admin-container page-enter">
    <div class="admin-header">
      <div>
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#ff3344'" onmouseout="this.style.color='var(--text-secondary)'">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Ana Sayfaya Dön
        </a>
        <h1 class="admin-title">Yönetim Paneli</h1>
      </div>
      <button onclick="localStorage.removeItem('aniverse_currentUser'); localStorage.removeItem('userRole'); localStorage.removeItem('isLoggedIn'); window.location.href='index.html';" class="btn btn-primary" style="display: flex; align-items: center; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Siteden Çık
      </button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Toplam Kullanıcı</div>
        <div class="stat-value" id="stat-total-users">Yükleniyor...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Aktif Kullanıcılar</div>
        <div class="stat-value" id="stat-active-users" style="color: #10b981;">...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Premium Aboneler</div>
        <div class="stat-value" id="stat-premium-users" style="color: #ff3344;">...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Şu An İzleyenler</div>
        <div class="stat-value" id="stat-watching-users">...</div>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <h2 class="table-header">Canlı İzleme ve Kullanıcılar</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Kullanıcı Adı</th>
            <th>Durum</th>
            <th>Abonelik</th>
            <th>Şu An İzlediği</th>
            <th>Kayıt Tarihi</th>
          </tr>
        </thead>
        <tbody id="user-table-body">
          <!-- Rows will be injected by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Inject Header and Footer
      Components.injectLayout();

      try {
        // Backend API'sine istek atıyoruz (Gerçek URL ile değiştirin)
        const response = await fetch('/api/admin/dashboard');
        
        if (!response.ok) throw new Error('API Hatası');
        
        const data = await response.json();
        
        // İstatistikleri Güncelle
        document.getElementById('stat-total-users').textContent = data.totalUsers.toLocaleString();
        document.getElementById('stat-active-users').textContent = data.activeUsers.toLocaleString();
        document.getElementById('stat-premium-users').textContent = data.premiumUsers.toLocaleString();
        document.getElementById('stat-watching-users').textContent = data.watchingUsers.toLocaleString();

        // Tabloyu Güncelle
        renderUsersTable(data.users);

      } catch (error) {
        console.warn('Backend API ulaşılamadı veya hata döndü.', error);
        
        // Hata durumunda yükleniyor yazılarını kaldır ve hata mesajı bas
        document.getElementById('stat-total-users').textContent = 'Hata';
        document.getElementById('stat-active-users').textContent = 'Hata';
        document.getElementById('stat-premium-users').textContent = 'Hata';
        document.getElementById('stat-watching-users').textContent = 'Hata';
        
        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ff3344; padding: 30px;">Veriler şu an yüklenemedi. Lütfen backend bağlantısını kontrol edin.</td></tr>';
      }
    });

    function renderUsersTable(users) {
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = ''; // Temizle
      
      if (!users || users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px;">Kayıtlı kullanıcı bulunamadı.</td></tr>';
        return;
      }

      users.forEach(user => {
        const isOnline = user.status === 'Aktif';
        const isPremium = user.subType === 'Premium';
        
        const tr = document.createElement('tr');
        tr.innerHTML = \`
          <td style="font-weight: 600;">\${user.username}</td>
          <td>
            <div class="status-badge \${isOnline ? 'status-active' : 'status-offline'}">
              <div class="status-dot"></div>
              \${user.status}
            </div>
          </td>
          <td>
            <span class="sub-badge \${isPremium ? 'sub-premium' : 'sub-free'}">
              \${user.subType}
            </span>
          </td>
          <td style="color: \${user.watching.includes('Hiçbiri') ? 'var(--text-secondary)' : 'white'};">
            \${user.watching}
          </td>
          <td>\${user.regDate}</td>
        \`;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
