<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli - AniVerse</title>
  
  <script>
    // Route Guard: Redirect if not admin
    if (localStorage.getItem('userRole') !== 'admin') {
      window.location.href = 'index.html';
    }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    .admin-container {
      padding: 120px 20px 60px;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }
    .admin-title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: white;
      text-shadow: 0 0 10px rgba(255, 51, 68, 0.3);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }
    .stat-card {
      background: rgba(20, 20, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-gradient);
    }
    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      color: white;
      font-size: 2.2rem;
      font-family: var(--font-display);
      font-weight: 700;
    }
    
    .table-container {
      background: rgba(20, 20, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow-x: auto;
    }
    .table-header {
      font-size: 1.5rem;
      font-family: var(--font-display);
      color: white;
      margin-bottom: 20px;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .admin-table th {
      color: var(--text-secondary);
      font-weight: 600;
      padding: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .admin-table td {
      padding: 15px;
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }
    .admin-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-active .status-dot { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .status-offline .status-dot { background: #6b7280; }
    
    .sub-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .sub-premium { background: rgba(255, 51, 68, 0.15); color: #ff3344; border: 1px solid rgba(255,51,68,0.3); }
    .sub-free { background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); }
  </style>
</head>
<body class="admin-page">

  <main class="admin-container page-enter">
    <div class="admin-header">
      <div>
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; transition: color 0.3s;" onmouseover="this.style.color='#ff3344'" onmouseout="this.style.color='var(--text-secondary)'">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Ana Sayfaya Dön
        </a>
        <h1 class="admin-title">Yönetim Paneli</h1>
      </div>
      <button onclick="localStorage.removeItem('aniverse_currentUser'); localStorage.removeItem('userRole'); localStorage.removeItem('isLoggedIn'); window.location.href='index.html';" class="btn btn-primary" style="display: flex; align-items: center; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Siteden Çık
      </button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
      <div class="stat-card">
        <div class="stat-label">Toplam Kullanıcı</div>
        <div class="stat-value" id="stat-total-users">Yükleniyor...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Premium Aboneler</div>
        <div class="stat-value" id="stat-premium-users" style="color: #ff3344;">...</div>
      </div>
    </div>

    <!-- Forms Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; margin-bottom: 50px;">
      
      <!-- 1. ANİME EKLEME FORMU -->
      <div class="table-container" style="margin-bottom: 0;">
        <h2 class="table-header" style="display: flex; align-items: center; gap: 10px; font-size: 1.3rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff3344" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
          Yeni Anime Ekle
        </h2>
        <form id="add-anime-form" onsubmit="handleAddAnime(event)">
          <div class="form-group" style="margin-bottom: 18px;">
            <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Anime Adı</label>
            <input type="text" id="anime-title-input" required placeholder="Örn: Solo Leveling" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;" onfocus="this.style.borderColor='#ff3344'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
          </div>
          <div class="form-group" style="margin-bottom: 18px;">
            <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Kapak Fotoğrafı (URL)</label>
            <input type="url" id="anime-cover-input" required placeholder="https://images.unsplash.com/..." style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;" onfocus="this.style.borderColor='#ff3344'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
          </div>
          <div class="form-group" style="margin-bottom: 18px;">
            <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Toplam Sezon Sayısı</label>
            <input type="number" id="anime-seasons-input" min="1" max="20" value="1" required style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;" onfocus="this.style.borderColor='#ff3344'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
          </div>

          <!-- DİREKT SEZON BÖLÜMLERİ GİRİŞİ (GİRDİKÇE ARTAN) -->
          <div class="form-group" style="margin-bottom: 24px; background:rgba(0,0,0,0.25); padding:16px; border-radius:12px; border:1px solid rgba(255,51,68,0.25);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <label style="color:#ff3344; font-weight:700; font-size:0.9rem; display:flex; align-items:center; gap:6px;">
                <span>🎬 Sezon Bölümleri (Embed Video Linkleri)</span>
              </label>
              <button type="button" onclick="addNextEpisodeInputRow()" style="background:#ff3344; color:white; border:none; padding:6px 12px; border-radius:8px; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='none'">+ 2. Bölümü Ekle</button>
            </div>
            
            <div id="dynamic-episode-list" style="display:flex; flex-direction:column; gap:10px;">
              <div class="dynamic-ep-row" style="display:flex; gap:8px; align-items:center;">
                <span class="ep-num-badge" style="background:rgba(255,51,68,0.15); color:#ff3344; border:1px solid rgba(255,51,68,0.3); padding:10px 14px; border-radius:8px; font-weight:700; font-size:0.85rem; min-width:85px; text-align:center;">1. Bölüm</span>
                <input type="text" class="anime-new-ep-input" placeholder="https://tau-video.xyz/... veya <iframe src='...'>" style="flex:1; padding:10px 14px; background:#121216; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:white; outline:none; font-size:0.85rem;" onfocus="this.style.borderColor='#ff3344'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
              </div>
            </div>
            <p style="color:var(--text-tertiary); font-size:0.75rem; margin-top:10px; margin-bottom:0;">💡 Alt alta eklediğin linkler otomatik olarak 1. Bölüm, 2. Bölüm sırasıyla animeye tanımlanır.</p>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-weight:700; border-radius:10px; background:#ff3344; color:white; border:none; cursor:pointer; box-shadow: 0 4px 15px rgba(255,51,68,0.3); transition:all 0.3s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'">Animeyi ve Bölümlerini Kaydet</button>
        </form>
      </div>

      <!-- 2. BÖLÜM EKLEME FORMU -->
      <div class="table-container" style="margin-bottom: 0;">
        <h2 class="table-header" style="display: flex; align-items: center; gap: 10px; font-size: 1.3rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Yeni Bölüm Ekle
        </h2>
        <form id="add-episode-form" onsubmit="handleAddEpisode(event)">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:18px;">
            <div class="form-group">
              <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Anime Seçimi</label>
              <select id="episode-anime-select" required onchange="handleAnimeSelectChange()" style="width:100%; padding:12px 14px; background:#121216; border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;" onfocus="this.style.borderColor='#06b6d4'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
                <option value="">Anime Seçin...</option>
              </select>
            </div>
            <div class="form-group">
              <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Sezon Seçimi</label>
              <select id="episode-season-select" required disabled style="width:100%; padding:12px 14px; background:#121216; border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;" onfocus="this.style.borderColor='#06b6d4'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
                <option value="">Önce Anime Seçin</option>
              </select>
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 18px;">
            <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Bölüm Numarası</label>
            <input type="number" id="episode-num-input" min="1" max="1000" placeholder="1" required style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;" onfocus="this.style.borderColor='#06b6d4'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
          </div>
          <div class="form-group" style="margin-bottom: 24px;">
            <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Video Kaynağı / Embed Linki (SRC)</label>
            <textarea id="episode-src-input" rows="2" required placeholder="https://tau-video.xyz/embed/... veya <iframe src='...'>" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; font-family:monospace; font-size:0.85rem; resize:vertical; outline:none;" onfocus="this.style.borderColor='#06b6d4'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-weight:700; border-radius:10px; background:#06b6d4; color:white; border:none; cursor:pointer; box-shadow: 0 4px 15px rgba(6,182,212,0.3); transition:all 0.3s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'">Bölümü Yayınla</button>
        </form>
      </div>

      <!-- 3. YAYIN TAKVİMİ DÜZENLEME FORMU -->
      <div class="table-container" style="margin-bottom: 0;">
        <h2 class="table-header" style="display: flex; align-items: center; gap: 10px; font-size: 1.3rem;">
          <span style="color:#eab308">📅</span> Yayın Takvimi Düzenle
        </h2>
        <form id="add-schedule-form" onsubmit="handleAddSchedule(event)">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:18px;">
            <div class="form-group">
              <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Yayın Günü</label>
              <select id="schedule-day-select" required style="width:100%; padding:12px 14px; background:#121216; border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;">
                <option value="Pazartesi">Pazartesi</option>
                <option value="Salı">Salı</option>
                <option value="Çarşamba">Çarşamba</option>
                <option value="Perşembe">Perşembe</option>
                <option value="Cuma">Cuma</option>
                <option value="Cumartesi">Cumartesi</option>
                <option value="Pazar">Pazar</option>
              </select>
            </div>
            <div class="form-group">
              <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Yayın Saati</label>
              <input type="time" id="schedule-time-input" value="20:00" required style="width:100%; padding:12px 14px; background:#121216; border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;">
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 24px;">
            <label style="display:block; color:var(--text-secondary); margin-bottom:8px; font-weight:600; font-size:0.85rem;">Anime Seçimi</label>
            <select id="schedule-anime-select" required style="width:100%; padding:12px 14px; background:#121216; border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:white; outline:none;">
              <option value="">Anime Seçin...</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-weight:700; border-radius:10px; background:#eab308; color:#000; border:none; cursor:pointer; box-shadow: 0 4px 15px rgba(234,179,8,0.25);">Takvime Kaydet</button>
        </form>

        <!-- AKTİF TAKVİM LİSTESİ -->
        <div style="margin-top:24px; border-top:1px solid rgba(255,255,255,0.1); padding-top:16px;">
          <h3 style="font-size:0.95rem; color:var(--text-secondary); margin-bottom:10px;">Planlanmış Yayınlar</h3>
          <div id="active-schedule-list" style="display:flex; flex-direction:column; gap:8px; max-height:180px; overflow-y:auto;">
            <!-- JS populates -->
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Inject Header and Footer
      Components.injectLayout();

      // 1. Önce C# Veritabanından (API) gerçek sayıları çekmeyi dener
      const endpoints = ['/api/admin/dashboard', '/Admin/GetStats', '/Admin/GetDashboardStats', '/Admin/stats', '/api/Admin/dashboard'];
      let fetchedData = null;
      
      // Sadece gerçek bir C# sunucusunda çalışırken probe et (dosyadan çift tıklama file:// veya statik önizlemede konsolu kırmızı hatalarla boğma)
      const isLiveBackend = window.location.protocol.includes('http') && !window.location.hostname.includes('github') && !window.location.hostname.includes('vercel');

      if (isLiveBackend) {
        for (const ep of endpoints) {
          try {
            const response = await fetch(ep);
            if (response.ok) {
              fetchedData = await response.json();
              break;
            }
          } catch (err) {}
        }
      }

      if (fetchedData) {
        const total = fetchedData.totalUsers !== undefined ? fetchedData.totalUsers : (fetchedData.TotalUsers !== undefined ? fetchedData.TotalUsers : (fetchedData.count || 0));
        const premium = fetchedData.premiumUsers !== undefined ? fetchedData.premiumUsers : (fetchedData.PremiumUsers || 0);
        
        document.getElementById('stat-total-users').textContent = total.toLocaleString();
        document.getElementById('stat-premium-users').textContent = premium.toLocaleString();
      } else {
        // 2. C# Sunucusu yoksa tarayıcı veritabanında (LocalStorage DB) tam olarak ne varsa sadece onu bas (1248 sahte sayısı yok)
        const storedUsers = JSON.parse(localStorage.getItem('aniverse_users') || '[]');
        const activeUser = JSON.parse(localStorage.getItem('aniverse_currentUser') || 'null');
        
        // Databasede ne varsa sadece o: Eğer kayıtlı üye yoksa ama şu an birisi giriş yapmışsa 1, yoksa storedUsers.length
        const exactCount = storedUsers.length > 0 ? storedUsers.length : (activeUser ? 1 : 0);
        const exactPremium = storedUsers.filter(u => u.subType === 'Premium' || u.isPremium).length;

        document.getElementById('stat-total-users').textContent = exactCount.toLocaleString();
        document.getElementById('stat-premium-users').textContent = exactPremium.toLocaleString();
      }

      // Populate Anime Dropdown
      initAnimeDropdown();
    });

    // --- FORM MANAGEMENT & DYNAMIC SEASONS ---
    let availableAnimes = [];

    function initAnimeDropdown() {
      const defaultAnimes = typeof getAnimes === 'function' ? getAnimes() : [];
      const storedAnimes = JSON.parse(localStorage.getItem('admin_added_animes') || '[]');
      
      availableAnimes = [...defaultAnimes.map(a => ({ id: a.id, title: a.title, seasons: a.seasons || 2 })), ...storedAnimes];
      
      const select = document.getElementById('episode-anime-select');
      const schSelect = document.getElementById('schedule-anime-select');
      if (select) select.innerHTML = '<option value="">Anime Seçin...</option>';
      if (schSelect) schSelect.innerHTML = '<option value="">Anime Seçin...</option>';
      
      availableAnimes.forEach(anime => {
        if (select) {
          const opt = document.createElement('option');
          opt.value = anime.id;
          opt.textContent = `${anime.title} (${anime.seasons} Sezon)`;
          select.appendChild(opt);
        }
        if (schSelect) {
          const schOpt = document.createElement('option');
          schOpt.value = anime.id;
          schOpt.textContent = anime.title;
          schSelect.appendChild(schOpt);
        }
      });
      if (typeof renderActiveScheduleList === 'function') renderActiveScheduleList();
    }

    function addNextEpisodeInputRow() {
      const container = document.getElementById('dynamic-episode-list');
      if (!container) return;
      const nextNum = container.children.length + 1;
      
      const row = document.createElement('div');
      row.className = 'dynamic-ep-row';
      row.style.cssText = 'display:flex; gap:8px; align-items:center;';
      
      row.innerHTML = `
        <span class="ep-num-badge" style="background:rgba(255,51,68,0.15); color:#ff3344; border:1px solid rgba(255,51,68,0.3); padding:10px 14px; border-radius:8px; font-weight:700; font-size:0.85rem; min-width:85px; text-align:center;">${nextNum}. Bölüm</span>
        <input type="text" class="anime-new-ep-input" placeholder="https://tau-video.xyz/... veya <iframe src='...'>" style="flex:1; padding:10px 14px; background:#121216; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:white; outline:none; font-size:0.85rem;" onfocus="this.style.borderColor='#ff3344'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
        <button type="button" onclick="this.parentElement.remove(); reindexDynamicEpisodes();" style="background:rgba(255,255,255,0.05); color:#ef4444; border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:10px 12px; cursor:pointer; font-weight:700;">Sil</button>
      `;
      container.appendChild(row);
      const inp = row.querySelector('input');
      if (inp) inp.focus();
    }

    function reindexDynamicEpisodes() {
      const rows = document.querySelectorAll('#dynamic-episode-list .dynamic-ep-row');
      rows.forEach((r, idx) => {
        const badge = r.querySelector('.ep-num-badge');
        if (badge) badge.textContent = `${idx + 1}. Bölüm`;
      });
    }

    function handleAnimeSelectChange() {
      const animeId = document.getElementById('episode-anime-select').value;
      const seasonSelect = document.getElementById('episode-season-select');
      
      if (!animeId) {
        seasonSelect.innerHTML = '<option value="">Önce Anime Seçin</option>';
        seasonSelect.disabled = true;
        return;
      }

      const selectedAnime = availableAnimes.find(a => String(a.id) === String(animeId));
      const seasonCount = selectedAnime ? selectedAnime.seasons : 1;

      seasonSelect.innerHTML = '';
      for (let i = 1; i <= seasonCount; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i}. Sezon`;
        seasonSelect.appendChild(opt);
      }
      seasonSelect.disabled = false;

      // Otomatik sıradaki bölüm numarasını hesapla (Örn: 1 bölüm varsa otomatik 2 yaz)
      const storedEps = JSON.parse(localStorage.getItem('admin_added_episodes') || '[]');
      const existingCount = storedEps.filter(e => String(e.animeId) === String(animeId)).length + (selectedAnime && selectedAnime.episodes ? selectedAnime.episodes.length : 0);
      const numInput = document.getElementById('episode-num-input');
      if (numInput) numInput.value = existingCount + 1;
    }

    function handleAddAnime(e) {
      e.preventDefault();
      const title = document.getElementById('anime-title-input').value;
      const cover = document.getElementById('anime-cover-input').value;
      const seasons = parseInt(document.getElementById('anime-seasons-input').value) || 1;

      const epInputs = document.querySelectorAll('.anime-new-ep-input');
      const episodes = [];
      epInputs.forEach((inp, idx) => {
        const val = inp.value.trim();
        if (val) {
          let cleanUrl = val;
          if (val.includes('<iframe')) {
            const m = val.match(/src=["'](.*?)["']/);
            if (m && m[1]) cleanUrl = m[1];
          }
          episodes.push({
            number: idx + 1,
            title: `${idx + 1}. Bölüm`,
            duration: "24:00",
            embedUrl: cleanUrl
          });
        }
      });

      const numId = Date.now();
      const newAnime = {
        id: numId,
        title,
        titleJp: title,
        image: cover,
        banner: cover,
        description: `${title} efsanesi AniVerse platformunda.`,
        genres: ["Aksiyon", "Macera", "Fantastik"],
        rating: 8.8,
        year: new Date().getFullYear(),
        season: "Bahar",
        status: "Devam Ediyor",
        studio: "AniVerse Studio",
        totalEpisodes: episodes.length > 0 ? episodes.length : 12,
        popularity: 92,
        isNew: true,
        quality: "1080p",
        seasons,
        episodes
      };

      const stored = JSON.parse(localStorage.getItem('admin_added_animes') || '[]');
      stored.push(newAnime);
      localStorage.setItem('admin_added_animes', JSON.stringify(stored));
      
      alert(`"${title}" (${episodes.length} Bölüm ile birlikte) başarıyla sisteme eklendi!`);
      document.getElementById('add-anime-form').reset();
      
      // Reset episode list to just 1 row
      const listContainer = document.getElementById('dynamic-episode-list');
      if (listContainer) {
        listContainer.innerHTML = `
          <div class="dynamic-ep-row" style="display:flex; gap:8px; align-items:center;">
            <span class="ep-num-badge" style="background:rgba(255,51,68,0.15); color:#ff3344; border:1px solid rgba(255,51,68,0.3); padding:10px 14px; border-radius:8px; font-weight:700; font-size:0.85rem; min-width:85px; text-align:center;">1. Bölüm</span>
            <input type="text" class="anime-new-ep-input" placeholder="https://tau-video.xyz/... veya <iframe src='...'>" style="flex:1; padding:10px 14px; background:#121216; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:white; outline:none; font-size:0.85rem;" onfocus="this.style.borderColor='#ff3344'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
          </div>
        `;
      }
      initAnimeDropdown();
    }

    function handleAddEpisode(e) {
      e.preventDefault();
      const animeId = document.getElementById('episode-anime-select').value;
      const season = document.getElementById('episode-season-select').value;
      const episodeNum = document.getElementById('episode-num-input').value;
      const src = document.getElementById('episode-src-input').value;

      const selectedAnime = availableAnimes.find(a => String(a.id) === String(animeId));
      const animeName = selectedAnime ? selectedAnime.title : 'Bilinmeyen Anime';

      const storedEps = JSON.parse(localStorage.getItem('admin_added_episodes') || '[]');
      storedEps.push({ animeId, animeName, season, episodeNum, src, date: new Date().toISOString() });
      localStorage.setItem('admin_added_episodes', JSON.stringify(storedEps));

      const nextNum = parseInt(episodeNum) + 1;
      document.getElementById('episode-src-input').value = '';
      document.getElementById('episode-num-input').value = nextNum;

      alert(`✅ Bölüm yayınlandı: ${animeName} - S${season} B${episodeNum}\n\n➡️ Kutucuk sıradaki bölüm (${nextNum}. Bölüm) için otomatik artırıldı!`);
    }

    // --- SCHEDULE MANAGEMENT ---
    function renderActiveScheduleList() {
      const container = document.getElementById('active-schedule-list');
      if (!container) return;
      const stored = JSON.parse(localStorage.getItem('admin_broadcast_schedule') || 'null') || [
        { id: 'sch_1', day: 'Pazartesi', animeId: 111, time: '20:30' }
      ];

      if (stored.length === 0) {
        container.innerHTML = '<p style="color:var(--text-tertiary); font-size:0.85rem;">Henüz takvime bir yayın eklenmemiş.</p>';
        return;
      }

      let html = '';
      stored.forEach((item, idx) => {
        const anime = availableAnimes.find(a => String(a.id) === String(item.animeId));
        const name = anime ? anime.title : 'Anime';
        html += `
          <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.03); padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.08);">
            <div style="font-size:0.85rem; color:white;">
              <span style="color:#eab308; font-weight:700;">[${item.day} - ${item.time}]</span> ${name}
            </div>
            <button type="button" onclick="removeScheduleItem(${idx})" style="background:rgba(239,68,68,0.2); color:#ef4444; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:700; font-size:0.75rem;">Sil</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function handleAddSchedule(e) {
      e.preventDefault();
      const day = document.getElementById('schedule-day-select').value;
      const animeId = document.getElementById('schedule-anime-select').value;
      const time = document.getElementById('schedule-time-input').value;

      const stored = JSON.parse(localStorage.getItem('admin_broadcast_schedule') || 'null') || [
        { id: 'sch_1', day: 'Pazartesi', animeId: 111, time: '20:30' }
      ];

      stored.push({ id: 'sch_' + Date.now(), day, animeId: parseInt(animeId) || animeId, time });
      localStorage.setItem('admin_broadcast_schedule', JSON.stringify(stored));
      alert('✅ Anime yayın takvime başarıyla eklendi!');
      renderActiveScheduleList();
    }

    function removeScheduleItem(idx) {
      const stored = JSON.parse(localStorage.getItem('admin_broadcast_schedule') || 'null') || [
        { id: 'sch_1', day: 'Pazartesi', animeId: 111, time: '20:30' }
      ];
      stored.splice(idx, 1);
      localStorage.setItem('admin_broadcast_schedule', JSON.stringify(stored));
      renderActiveScheduleList();
    }
    window.removeScheduleItem = removeScheduleItem;
  </script>
</body>
</html>
