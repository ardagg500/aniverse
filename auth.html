<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap & Kayıt Ol - AniVerse</title>
  <meta name="description" content="AniVerse hesabınıza giriş yapın veya yeni hesap oluşturun.">
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="loading-screen" id="loading-screen">
    <div class="loading-logo">AniVerse</div>
    <div class="spinner"></div>
  </div>

  <main class="page-enter auth-container-wrapper">
    <div class="auth-container">
      
      <!-- Toggle Buttons -->
      <div class="auth-toggle">
        <button class="toggle-btn active" id="btn-login" onclick="toggleAuth('login')">Giriş Yap</button>
        <button class="toggle-btn" id="btn-register" onclick="toggleAuth('register')">Kayıt Ol</button>
      </div>

      <!-- Form Container -->
      <div class="auth-form-wrapper">
        
        <!-- Login Form -->
        <form id="login-form" class="auth-form active-form" onsubmit="handleLogin(event)">
          <div class="form-header">
            <h2>Hoş Geldin!</h2>
            <p>Anime dünyasına geri dön.</p>
          </div>
          
          <div class="form-group">
            <label for="login-username">Kullanıcı Adı</label>
            <input type="text" id="login-username" required placeholder="Kullanıcı adınızı girin">
          </div>
          
          <div class="form-group">
            <label for="login-password">Şifre</label>
            <input type="password" id="login-password" required placeholder="Şifrenizi girin">
          </div>
          
          <div id="login-error" class="auth-error"></div>
          
          <button type="submit" class="btn btn-auth">Giriş Yap</button>
        </form>

        <!-- Register Form (Disabled for Demo) -->
        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
          <div class="form-header">
            <h2>Kayıtlar Durduruldu</h2>
            <p style="color: #ff3344; margin-top: 15px; font-weight: bold;">Kayıtlar geçici olarak durdurulmuştur.</p>
            <p style="margin-top: 10px;">Lütfen demo sürecinde sistem yöneticisi hesabını (admin / admin123) kullanınız.</p>
          </div>
          
          <div id="register-error" class="auth-error"></div>
        </form>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Components.injectLayout();
    });
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('loaded');
      }, 500);
    });
  </script>
  <script src="js/router.js"></script>
</body>
</html>
