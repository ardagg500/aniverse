<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap & Kayıt Ol - AniVerse</title>
  <meta name="description" content="AniVerse hesabınıza giriş yapın veya yeni hesap oluşturun.">
  
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <div class="loading-screen" id="loading-screen">
    <div class="loading-logo">AniVerse</div>
    <div class="spinner"></div>
  </div>

  <main class="page-enter auth-container-wrapper">
    <div class="auth-container">
      
      <!-- Toggle Buttons -->
      <div class="auth-toggle">
        <button class="toggle-btn active" id="btn-login" onclick="toggleAuth('login')">Giriş Yap</button>
        <button class="toggle-btn" id="btn-register" onclick="toggleAuth('register')">Kayıt Ol</button>
      </div>

      <!-- Form Container -->
      <div class="auth-form-wrapper">
        
        <!-- Login Form -->
        <form id="login-form" class="auth-form active-form" onsubmit="handleLogin(event)">
          <div class="form-header">
            <h2>Hoş Geldin!</h2>
            <p>Anime dünyasına geri dön.</p>
          </div>
          
          <div class="form-group">
            <label for="login-username">Kullanıcı Adı</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <input type="text" id="login-username" required placeholder="Kullanıcı adınızı girin">
            </div>
          </div>
          
          <div class="form-group">
            <label for="login-password">Şifre</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input type="password" id="login-password" required placeholder="Şifrenizi girin">
            </div>
          </div>
          
          <div id="login-error" class="auth-error"></div>
          
          <button type="submit" class="btn btn-auth">Giriş Yap</button>
        </form>

        <!-- Register Form (Disabled for Demo) -->
        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
          <div class="form-header">
            <h2>Kayıtlar Durduruldu</h2>
            <p style="color: #ff3344; margin-top: 15px; font-weight: bold;">Kayıtlar geçici olarak durdurulmuştur.</p>
            <p style="margin-top: 10px;">Lütfen demo sürecinde sistem yöneticisi hesabınızla giriş yapınız.</p>
          </div>
          
          <div id="register-error" class="auth-error"></div>
        </form>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/js/data.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Components.injectLayout();
    });
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('loaded');
      }, 500);
    });
  </script>
  <script src="/js/router.js"></script>
</body>
</html>
