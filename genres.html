<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Türler | AniVerse</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .genres-header {
      padding: var(--space-12) 0 var(--space-8);
      background: linear-gradient(to bottom, rgba(var(--accent-primary-rgb), 0.05) 0%, transparent 100%);
      margin-top: calc(-1 * var(--nav-height));
      padding-top: calc(var(--nav-height) + var(--space-12));
      border-bottom: 1px solid var(--glass-border);
      text-align: center;
    }
    
    .genres-grid-large {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--space-6);
      margin-top: var(--space-8);
    }
    
    .genre-card-large {
      position: relative;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-8) var(--space-6);
      text-align: center;
      transition: all var(--transition-base);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    
    .genre-card-large:hover {
      transform: translateY(-5px);
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      box-shadow: var(--shadow-glow-sm);
    }
    
    .genre-icon-large {
      font-size: 3rem;
      margin-bottom: var(--space-4);
      filter: drop-shadow(0 0 10px rgba(var(--accent-primary-rgb), 0.5));
      transition: transform var(--transition-base);
    }
    
    .genre-card-large:hover .genre-icon-large {
      transform: scale(1.1) rotate(5deg);
    }
    
    .genre-name-large {
      font-size: var(--text-xl);
      font-family: var(--font-display);
      font-weight: 700;
      margin-bottom: var(--space-2);
    }
    
    .genre-count-large {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 12px;
      border-radius: var(--radius-full);
    }
  </style>
</head>
<body>
  
  <main class="page-enter">
    
    <div class="genres-header">
      <div class="container">
        <h1 class="text-4xl font-bold mb-4">Animeleri Türlerine Göre Keşfet</h1>
        <p class="text-secondary max-w-2xl mx-auto">Aksiyondan romantiğe, bilim kurgudan drama kadar yüzlerce animeyi ilgi alanına göre filtrele.</p>
      </div>
    </div>
    
    <div class="container section pt-0">
      <div class="genres-grid-large" id="genres-container">
        <!-- Injected by JS -->
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/genres.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
