<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendler | AniVerse</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .trending-header {
      padding: var(--space-12) 0 var(--space-8);
      background: linear-gradient(to bottom, rgba(var(--accent-warm), 0.05) 0%, transparent 100%);
      margin-top: calc(-1 * var(--nav-height));
      padding-top: calc(var(--nav-height) + var(--space-12));
      border-bottom: 1px solid var(--glass-border);
      text-align: center;
    }
    
    .trending-icon {
      font-size: 3rem;
      margin-bottom: var(--space-4);
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }
    
    .top-3-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-6);
      margin-top: var(--space-12);
      margin-bottom: var(--space-16);
      align-items: flex-end;
    }
    
    .top-3-card {
      position: relative;
    }
    
    .top-3-card.rank-1 {
      transform: scale(1.1);
      z-index: 10;
    }
    
    .top-3-card.rank-2, .top-3-card.rank-3 {
      opacity: 0.9;
    }
    
    .rank-badge-large {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      background: var(--accent-gradient-warm);
      color: white;
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-full);
      z-index: 10;
      box-shadow: var(--shadow-glow);
      border: 3px solid var(--bg-primary);
    }
    
    .rank-1 .rank-badge-large {
      width: 60px;
      height: 60px;
      font-size: 2rem;
      top: -30px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
    }
    
    .rank-2 .rank-badge-large { background: linear-gradient(135deg, #9ca3af 0%, #4b5563 100%); }
    .rank-3 .rank-badge-large { background: linear-gradient(135deg, #b45309 0%, #78350f 100%); }
    
    @media (max-width: 768px) {
      .top-3-grid {
        grid-template-columns: 1fr;
        align-items: stretch;
      }
      .top-3-card.rank-1 { transform: none; }
      .rank-badge-large {
        top: -15px;
        left: -15px;
        transform: none;
      }
    }
  </style>
</head>
<body>
  
  <main class="page-enter">
    
    <div class="trending-header">
      <div class="container">
        <div class="trending-icon">🔥</div>
        <h1 class="text-4xl font-bold mb-4">Şu Anki Trendler</h1>
        <p class="text-secondary max-w-2xl mx-auto">AniVerse topluluğu tarafından en çok izlenen ve beğenilen animeler. Liste her saat başı güncellenmektedir.</p>
      </div>
    </div>
    
    <div class="container section pt-0">
      <h2 class="text-2xl font-bold mb-8 text-center text-muted">Haftanın Liderleri</h2>
      <div class="top-3-grid" id="top-3-container">
        <!-- Injected by JS -->
      </div>
      
      <div class="mt-16">
        <h2 class="text-xl font-bold mb-6 pb-2 border-b border-glass text-muted">Diğer Popüler Animeler</h2>
        <div class="grid grid-auto-fill" id="rest-trending-container">
          <!-- Injected by JS -->
        </div>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="/js/data.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/trending.js"></script>
  <script src="/js/router.js"></script>
</body>
</html>
