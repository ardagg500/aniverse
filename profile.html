<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilim | AniVerse</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .profile-header {
      padding: var(--space-12) 0;
      background: linear-gradient(to bottom, rgba(var(--accent-primary-rgb), 0.1) 0%, transparent 100%);
      padding-top: 120px; /* Fixed navbar overlap */
      margin-bottom: var(--space-8);
      border-bottom: 1px solid var(--glass-border);
    }
    
    .profile-info {
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent-gradient);
      padding: 4px;
      box-shadow: var(--shadow-glow);
      flex-shrink: 0;
    }
    
    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--bg-primary);
    }
    
    .profile-details h1 {
      margin-bottom: var(--space-1);
      font-size: 2rem; /* Limit font size to prevent breaking */
      word-break: break-word;
    }
    
    .profile-details p {
      color: var(--text-secondary);
      margin-bottom: var(--space-3);
    }
    
    .profile-badges {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .stats-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 2rem;
    }

    .stat-card {
      background: rgba(20, 20, 25, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 51, 68, 0.3);
    }
    
    /* History Styles */
    .history-group {
      margin-bottom: var(--space-8);
    }
    
    .history-date {
      font-size: var(--text-lg);
      font-weight: 600;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--glass-border);
    }
    
    .history-card {
      display: flex;
      gap: var(--space-4);
      padding: var(--space-3);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
    }
    
    .history-thumb {
      width: 160px;
      aspect-ratio: 16/9;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      background: var(--bg-tertiary);
      flex-shrink: 0;
    }
    
    .history-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .history-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .history-title {
      font-weight: 600;
      margin-bottom: var(--space-1);
    }
    
    .history-ep {
      font-size: var(--text-sm);
      font-weight: 500;
      margin-bottom: var(--space-2);
    }
    
    .history-time {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
    }
    
    @media (max-width: 768px) {
      .profile-info {
        flex-direction: column;
        text-align: center;
      }
      .profile-badges {
        justify-content: center;
      }
      .history-card {
        flex-direction: column;
      }
      .history-thumb {
        width: 100%;
      }
      .grid-cols-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  
  <main class="page-enter">
    
    <div class="profile-header">
      <div class="container">
        <div class="profile-info animate-fade-in-up">
          <div class="profile-avatar">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%23ff3344'/><text x='100' y='100' font-family='Arial' font-weight='bold' font-size='80' fill='white' text-anchor='middle' dy='.35em'>A</text></svg>" alt="Kullanıcı Avatarı" id="profile-avatar-img">
          </div>
          <div class="profile-details">
            <h1 id="profile-username">Arda Boduroğlu</h1>
            <p>Üye katılışı: <span id="profile-date">Ocak 2025</span></p>
            <div class="profile-badges">
              <span class="badge badge-primary">Premium Üye</span>
              <span class="badge badge-success">Anime Gurmesi</span>
            </div>
          </div>
        </div>
        
        <div class="stats-grid-container animate-fade-in-up delay-2">
          <div class="stat-card">
            <div class="stat-card-icon">📺</div>
            <div class="stat-card-value" id="stat-eps">0</div>
            <div class="stat-card-label">İzlenen Bölüm</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon">⏱️</div>
            <div class="stat-card-value" id="stat-time">0</div>
            <div class="stat-card-label">Toplam Süre</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon">🏆</div>
            <div class="stat-card-value text-xl" id="stat-genre" style="font-size: var(--text-2xl); line-height: 1.5;">Yok</div>
            <div class="stat-card-label">Favori Tür</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon">📋</div>
            <div class="stat-card-value" id="stat-list">0</div>
            <div class="stat-card-label">Listedeki Anime</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="container section pt-0">
      <div class="flex justify-center mb-8 animate-fade-in-up delay-3" style="display: flex; justify-content: center; width: 100%;">
        <div class="tabs" style="display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;">
          <button class="tab-btn active" data-target="tab-watchlist">İzleme Listem (<span id="watchlist-count">0</span>)</button>
          <button class="tab-btn" data-target="tab-favorites">Favoriler (<span id="favorites-count">0</span>)</button>
          <button class="tab-btn" data-target="tab-history">İzleme Geçmişi (<span id="history-count">0</span>)</button>
        </div>
      </div>
      
      <div class="tab-content active" id="tab-watchlist">
        <div class="grid grid-auto-fill" id="watchlist-grid">
          <!-- Injected by profile.js -->
        </div>
      </div>
      
      <div class="tab-content" id="tab-favorites">
        <div class="grid grid-auto-fill" id="favorites-grid">
          <!-- Injected by profile.js -->
        </div>
      </div>
      
      <div class="tab-content" id="tab-history">
        <div id="history-list">
          <!-- Injected by profile.js -->
        </div>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
