<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniVerse - Modern Anime İzleme Platformu</title>
  <meta name="description" content="En sevdiğiniz animeleri yüksek kalitede, kesintisiz ve harika bir arayüzle izleyin.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="icon" type="image/png" href="/assets/logo.svg">
  <link rel="apple-touch-icon" href="/assets/logo.svg">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  
  <!-- Loading Screen -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-logo">AniVerse</div>
    <div class="spinner"></div>
  </div>

  <main class="page-enter" id="main-content">
    <!-- Hero Section -->
    <section class="hero-section" id="hero-slider">
      <!-- Injected by app.js -->
    </section>

    <!-- Continue Watching -->
    <section class="section container">
      <div class="section-header reveal">
        <h2 class="section-title">
          <span class="icon text-accent">▶</span> İzlemeye Devam Et
        </h2>
        <a href="profile.html" class="section-link">Tümünü Gör</a>
      </div>
      <div class="scroll-row" id="continue-watching">
        <!-- Injected by app.js -->
      </div>
    </section>

    <!-- Haftanın Popülerleri (Horizontal Scroll) -->
    <section class="section container overflow-hidden">
      <div class="section-header reveal">
        <h2 class="section-title">
          <span class="icon text-warning">⭐</span> Haftanın Popülerleri
        </h2>
        <a href="trending.html" class="section-link">Tümünü Gör</a>
      </div>
      <div class="horizontal-scroll-container" id="popular-weekly">
        <!-- Injected by app.js -->
      </div>
    </section>

    <!-- Haftalık Yayın Takvimi (Admin Kontrollü) -->
    <section class="section container" id="weekly-schedule-section">
      <div class="section-header reveal">
        <h2 class="section-title">
          <span class="icon text-accent">📅</span> Haftalık Yayın Takvimi
        </h2>
      </div>
      <div class="schedule-days-bar" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:15px; margin-bottom:20px;">
        <button class="btn btn-secondary schedule-tab active" data-day="Pazartesi" onclick="switchScheduleDay('Pazartesi')" style="min-width:110px; font-weight:700;">Pazartesi</button>
        <button class="btn btn-secondary schedule-tab" data-day="Salı" onclick="switchScheduleDay('Salı')" style="min-width:90px; font-weight:700;">Salı</button>
        <button class="btn btn-secondary schedule-tab" data-day="Çarşamba" onclick="switchScheduleDay('Çarşamba')" style="min-width:110px; font-weight:700;">Çarşamba</button>
        <button class="btn btn-secondary schedule-tab" data-day="Perşembe" onclick="switchScheduleDay('Perşembe')" style="min-width:110px; font-weight:700;">Perşembe</button>
        <button class="btn btn-secondary schedule-tab" data-day="Cuma" onclick="switchScheduleDay('Cuma')" style="min-width:90px; font-weight:700;">Cuma</button>
        <button class="btn btn-secondary schedule-tab" data-day="Cumartesi" onclick="switchScheduleDay('Cumartesi')" style="min-width:110px; font-weight:700;">Cumartesi</button>
        <button class="btn btn-secondary schedule-tab" data-day="Pazar" onclick="switchScheduleDay('Pazar')" style="min-width:90px; font-weight:700;">Pazar</button>
      </div>
      <div id="schedule-day-content" class="grid grid-auto-fill" style="min-height:120px;">
        <!-- Injected by app.js -->
      </div>
    </section>

    <!-- Son Eklenen Bölümler (Grid) -->
    <section class="section container">
      <div class="section-header reveal">
        <h2 class="section-title">
          <span class="icon text-success">📺</span> Son Eklenen Bölümler
        </h2>
      </div>
      <div class="grid grid-auto-fill" id="new-episodes">
        <!-- Injected by app.js -->
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="/js/data.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/router.js"></script>
  <script>
    // Remove loading screen when ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('loaded');
      }, 500); // Small delay for effect
    });
  </script>
</body>
</html>
